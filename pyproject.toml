[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "langgraph-workflow"
version = "0.1.0"
description = "Host-agnostic LangGraph workflow executor that drives bounded jobs through an injected agent runtime."
readme = "README.md"
requires-python = ">=3.10"
# No license is declared yet: the repository owner has not chosen one.
# See docs/implementation-status.md before distributing.
dependencies = [
    # 1.2.2 is the newest release whose langgraph-sdk range (<0.4) does not cap
    # websockets below 17; Locus pins websockets==17.0. Newer 1.2.x resolve in
    # standalone use. See docs/architecture.md#dependencies.
    "langgraph>=1.2.2,<1.3",
    "langgraph-checkpoint>=4.1,<5",
    "langgraph-checkpoint-sqlite>=3.1,<3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.12", "build>=1.2", "cryptography>=44"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["locus: requires a prepared disposable Locus checkout (LOCUS_REPO)"]
